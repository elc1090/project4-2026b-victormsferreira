[package]
name = "project4"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = { version = "0.7", features = ["json"]}
tokio = { version = "1"}
serde = { version = "1.0", features = ["derive"] }  
yew = { version = "0.23", features = ["csr"] }
yew-autoprops = "0.5.0"
implicit-clone = "0.6.0"
gloo-console = "0.4.1"
web-sys = { version = "0.3.107", features = ["SvgElement",
  "Document",
  "Location",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "HtmlImageElement",
  "KeyboardEvent",
  "DomRect",
  "Element"
  ] }
yew-hooks = "0.6.4"
gloo-storage = "0.4.1"
yew-router = "0.20.0"
wasm-bindgen = "0.2.130"
gloo-render = "0.3.1"
gloo-events = "0.3.1"
hecs = "0.11.2"